default: &DEFAULT
  # Audio Preprocessing Specifications
  sample_rate: 8000
  clip_length: 30
  normalize: !!bool True
  n_input: 2 # stereo channels

  # Model Architecture (ResNet Audio Classifier)
  model: "resnet"
  stride: 16
  n_channel: 300
  n_blocks: 10
  max_pool_every: 1
  num_classes: 150

  # Labels Metadata Lookup Path
  num_files_per_raga_path: "metadata_0.7.json"

resnet_0.7: &RESNET_0.7
  <<: *DEFAULT
